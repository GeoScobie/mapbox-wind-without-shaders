<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wind demo (MapLibre fallback)</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    html, body { margin: 0; height: 100%; }
    #map { position: absolute; inset: 0; }
    .note {
      position: absolute; left: 10px; bottom: 8px; z-index: 2;
      font: 11px system-ui, sans-serif; color: #a8b0ba;
      background: rgba(10,12,16,.55); padding: 4px 8px; border-radius: 6px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="note">MapLibre fallback only — preferred path is <a href="./demo.html" style="color:#7dd3fc">demo.html</a> (Mapbox globe).</div>
  <script type="module">
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/dark',
      center: [-119.7, 46.2],
      zoom: 4.2
    });
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
    window.map = map;
    map.on('load', async () => {
      const V = '20260922a';
      const [core, ui] = await Promise.all([
        import(`./js/wind-particles-cpu.js?v=${V}`),
        import(`./js/wind-ui.js?v=${V}`)
      ]);
      const MANIFEST = './sample-data/gfs/manifest.json';
      const man = await core.loadWindManifest(MANIFEST);
      const layer = await core.WindParticlesCPU.fromManifest(map, MANIFEST, {
        uRange: [-40, 40], vRange: [-40, 40]
      });
      ui.mountWindUI(map, layer, man, { loadManifest: core.loadWindManifest, hint: false });
    });
  </script>
</body>
</html>
